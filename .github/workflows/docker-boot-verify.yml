name: Docker Boot Verification

# Builds every custom image and boots the real infra/docker-compose.yml
# topology on GitHub's hosted runner, which has Docker preinstalled -
# unlike the coding agent's own environment (see SCRUM-20, SCRUM-27,
# SCRUM-33, SCRUM-42, all of which were blocked on "no Docker available
# here"). Runs automatically when Docker-relevant files change, and can
# be triggered manually at any time via workflow_dispatch.
on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "infra/docker-compose.yml"
      - "infra/docker-compose.dev.yml"
      - ".env.example"
      - "infra/.env.example"
      - "infra/kafka/kafka_setup.sh"
      - ".github/workflows/docker-boot-verify.yml"
  workflow_dispatch: {}

jobs:
  docker-boot-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        # Used later to register real models against the real committed
        # dataset (see "Register real fraud models in MLflow" below) and to
        # poll data/alerts.xlsx for a live alert row.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare env files
        run: |
          cp .env.example .env
          cp infra/.env.example infra/.env

      - name: Build all application images
        run: docker compose -f infra/docker-compose.yml build

      - name: Boot infra services (Zookeeper, Kafka, ksqlDB, MLflow)
        run: docker compose -f infra/docker-compose.yml up -d zookeeper kafka ksqldb-server mlflow

      - name: Wait for infra services to become reachable
        run: |
          wait_for_port() {
            local name=$1 port=$2
            echo "Waiting for $name on port $port..."
            for i in $(seq 1 36); do
              if (echo > "/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
                echo "$name is reachable"
                return 0
              fi
              sleep 5
            done
            echo "::error::$name did not become reachable on port $port within the timeout"
            return 1
          }
          wait_for_port zookeeper 2181
          wait_for_port kafka 9092
          wait_for_port ksqldb-server 8088
          wait_for_port mlflow 5000

      - name: Create Kafka topics (reuses infra/kafka/kafka_setup.sh)
        run: |
          docker compose -f infra/docker-compose.yml cp infra/kafka/kafka_setup.sh kafka:/tmp/kafka_setup.sh
          docker compose -f infra/docker-compose.yml exec -T kafka bash /tmp/kafka_setup.sh

      - name: Create ksqlDB streams (SCRUM-34, reuses alerts/streams/01+02)
        # Port being reachable (the earlier wait_for_port check) isn't the
        # same as the KSQL engine being ready to accept DDL - poll /info
        # first. jq builds the request body so the SQL file's own quoting
        # doesn't need to survive a shell string escape.
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8088/info >/dev/null 2>&1; then break; fi
            sleep 5
          done
          # No -f here deliberately: a failed KSQL statement returns a JSON
          # error body with a useful message, which -f would discard right
          # when it's most needed. Check the HTTP status explicitly instead.
          post_ksql() {
            status=$(jq -n --arg ksql "$(cat "$1")" '{ksql: $ksql, streamsProperties: {}}' \
              | curl -s -o /tmp/ksql-response.json -w '%{http_code}' -X POST http://localhost:8088/ksql \
                  -H "Content-Type: application/vnd.ksql.v1+json" -d @-)
            echo "$1 -> HTTP $status"
            cat /tmp/ksql-response.json
            echo
            [ "$status" = "200" ]
          }
          post_ksql alerts/streams/01_create_source_stream.sql
          post_ksql alerts/streams/02_create_scored_stream.sql
          echo "Streams now registered:"
          jq -n '{ksql: "SHOW STREAMS;", streamsProperties: {}}' \
            | curl -s -X POST http://localhost:8088/ksql \
                -H "Content-Type: application/vnd.ksql.v1+json" -d @- \
            | tee /tmp/ksql-streams.json
          for stream in TRANSACTIONS_STREAM SCORED_STREAM; do
            if ! grep -q "$stream" /tmp/ksql-streams.json; then
              echo "::error::$stream was not created"
              exit 1
            fi
          done

      - name: Boot application services (producer, pipeline, scoring, alerts, dashboard)
        # scoring used to crash here every time - a fresh compose run has an
        # empty mlruns volume with nothing registered, and FraudScorer used
        # to call load_latest_model() straight from __init__. Now it loads
        # lazily and survives a cold boot (see scoring/scorer.py), so it's
        # a normal required service here rather than a soft-failed one.
        # alerts is new (SCRUM-36) - previously excel_writer.py had no
        # consumer entrypoint to boot at all.
        run: docker compose -f infra/docker-compose.yml up -d producer pipeline scoring alerts dashboard

      - name: Give application services time to settle
        # pipeline resolves the spark-sql-kafka connector from Maven at
        # session startup (see spark_consumer.py), which takes longer than
        # the other services' plain process start. alerts' entrypoint.sh
        # also runs publish_reference_data.py to completion before it starts
        # consuming - this wait is what gives it time to finish so the
        # reference tables below have something to read.
        run: sleep 60

      - name: Create ksqlDB reference tables (SCRUM-33/36, reuses alerts/tables/*)
        # terminal_reference.sql and merchant_reference.sql are plain CREATE
        # TABLEs over the terminal-reference/merchant-reference topics that
        # alerts/publish_reference_data.py just populated (previous step).
        # ksql.streams.auto.offset.reset defaults to "latest", which would
        # make the table permanently blind to rows published before the
        # table existed - these need "earliest" so they materialize what's
        # already on the topic.
        run: |
          post_ksql_earliest() {
            status=$(jq -n --arg ksql "$(cat "$1")" \
                '{ksql: $ksql, streamsProperties: {"ksql.streams.auto.offset.reset": "earliest"}}' \
              | curl -s -o /tmp/ksql-response.json -w '%{http_code}' -X POST http://localhost:8088/ksql \
                  -H "Content-Type: application/vnd.ksql.v1+json" -d @-)
            echo "$1 -> HTTP $status"
            cat /tmp/ksql-response.json
            echo
            [ "$status" = "200" ]
          }
          post_ksql_earliest alerts/tables/terminal_reference.sql
          post_ksql_earliest alerts/tables/merchant_reference.sql
          echo "Tables now registered:"
          jq -n '{ksql: "SHOW TABLES;", streamsProperties: {}}' \
            | curl -s -X POST http://localhost:8088/ksql \
                -H "Content-Type: application/vnd.ksql.v1+json" -d @- \
            | tee /tmp/ksql-tables.json
          for table in TERMINAL_REFERENCE MERCHANT_REFERENCE; do
            if ! grep -q "$table" /tmp/ksql-tables.json; then
              echo "::error::$table was not created"
              exit 1
            fi
          done

      - name: Create ksqlDB alert_stream (SCRUM-36, reuses alerts/streams/03)
        # Joins transactions_stream + scored_stream against the two
        # reference tables just created. Also needs "earliest" so it
        # processes whatever producer/scoring already wrote to
        # pos-transactions/pos-fraud-scores before this query started,
        # rather than only rows emitted after.
        run: |
          status=$(jq -n --arg ksql "$(cat alerts/streams/03_create_alert_stream.sql)" \
              '{ksql: $ksql, streamsProperties: {"ksql.streams.auto.offset.reset": "earliest"}}' \
            | curl -s -o /tmp/ksql-response.json -w '%{http_code}' -X POST http://localhost:8088/ksql \
                -H "Content-Type: application/vnd.ksql.v1+json" -d @-)
          echo "alerts/streams/03_create_alert_stream.sql -> HTTP $status"
          cat /tmp/ksql-response.json
          echo
          [ "$status" = "200" ]
          echo "Streams now registered:"
          jq -n '{ksql: "SHOW STREAMS;", streamsProperties: {}}' \
            | curl -s -X POST http://localhost:8088/ksql \
                -H "Content-Type: application/vnd.ksql.v1+json" -d @- \
            | tee /tmp/ksql-streams-final.json
          if ! grep -q "ALERT_STREAM" /tmp/ksql-streams-final.json; then
            echo "::error::ALERT_STREAM was not created"
            exit 1
          fi

      - name: Report container status
        if: always()
        run: docker compose -f infra/docker-compose.yml ps

      - name: Dump logs for every service
        if: always()
        run: |
          for svc in zookeeper kafka ksqldb-server mlflow producer pipeline scoring alerts dashboard; do
            echo "::group::$svc logs"
            docker compose -f infra/docker-compose.yml logs --tail=80 "$svc" || true
            echo "::endgroup::"
          done

      - name: Assert infra + application services are running
        # One docker compose ps call, parsed locally, rather than one call
        # per service - 7 separate round-trips to a Docker daemon that's
        # also serving a full Spark JVM, Kafka, ksqlDB, and MLflow under a
        # 2-core/7GB runner has been observed to return inconsistent
        # per-call snapshots (a service reported "Up" a second earlier
        # showing "not found" on the very next call, with no exit event in
        # between) - a single snapshot is internally consistent.
        run: |
          set -e
          status="$(docker compose -f infra/docker-compose.yml ps --format '{{.Service}} {{.State}}')"
          echo "$status"
          failed=0
          for svc in zookeeper kafka ksqldb-server mlflow producer pipeline scoring alerts dashboard; do
            state=$(echo "$status" | awk -v s="$svc" '$1==s {print $2}')
            if [ "$state" != "running" ]; then
              echo "::error::$svc is not running (state=${state:-not found})"
              failed=1
            fi
          done
          exit $failed

      - name: Assert scoring's /health responds and self-reports not-ready
        # A running container isn't proof the app inside actually started -
        # confirm uvicorn is really serving requests, and that it's honest
        # about not having models yet rather than crashing on the first
        # /score call it receives.
        run: |
          set -e
          health=$(curl -sf http://localhost:8000/health)
          echo "$health"
          echo "$health" | grep -q '"models_ready":false' \
            || { echo "::error::expected models_ready:false on a fresh boot with nothing registered"; exit 1; }
          score_status=$(curl -s -o /tmp/score-response.json -w '%{http_code}' -X POST http://localhost:8000/score \
            -H "Content-Type: application/json" \
            -d '{"transaction_id":"ci-test","terminal_id":"TRM00001","card_bin":"539983","velocity_1h":1,"geo_jump_km":0,"bin_spend_rate":1000,"terminal_reversal_count":0,"amount_ngn":1000}')
          cat /tmp/score-response.json
          echo
          [ "$score_status" = "503" ] \
            || { echo "::error::expected 503 (models not ready) from /score, got $score_status"; exit 1; }
          # SCRUM-33's other never-verified claim: malformed requests return
          # 422. FastAPI/Pydantic does this by default on a schema
          # validation failure, but "the framework probably does it" had
          # never actually been checked against the real running service.
          malformed_status=$(curl -s -o /tmp/malformed-response.json -w '%{http_code}' -X POST http://localhost:8000/score \
            -H "Content-Type: application/json" \
            -d '{"transaction_id":"ci-test"}')
          cat /tmp/malformed-response.json
          echo
          [ "$malformed_status" = "422" ] \
            || { echo "::error::expected 422 for a malformed request (missing required fields), got $malformed_status"; exit 1; }

      - name: Assert producer, pipeline, and alerts actually reached Kafka
        # "running" alone isn't proof of working: an earlier run showed
        # pipeline as "running" while its logs were stuck retrying
        # "Connection to node -1 (localhost/127.0.0.1:9092) could not be
        # established" for the entire job - it never crashed, it just never
        # connected (root cause: KAFKA_BOOTSTRAP_SERVERS defaulted to
        # localhost:9092, wrong for a container - fixed via an environment:
        # override in infra/docker-compose.yml). A container that's alive
        # but stuck retrying the wrong address would pass the state check
        # above and shouldn't.
        run: |
          set -e
          failed=0
          for svc in producer pipeline alerts; do
            if docker compose -f infra/docker-compose.yml logs "$svc" | grep -q "could not be established"; then
              echo "::error::$svc logged a Kafka connection failure - it's alive but not actually connected"
              failed=1
            fi
          done
          exit $failed

      - name: Assert alerts published reference data at startup
        # entrypoint.sh runs publish_reference_data.py before kafka_consumer.py
        # (see alerts/Dockerfile) - this is the one line it prints on success,
        # proving the reference-data publisher actually ran and reached
        # Kafka, not just that the container stayed "running".
        run: |
          set -e
          if ! docker compose -f infra/docker-compose.yml logs alerts | grep -q "Published .* terminals, .* merchants"; then
            echo "::error::alerts never logged a successful reference-data publish"
            exit 1
          fi

      - name: Assert pipeline's scoring calls reached the scoring service
        # spark_consumer.py's call_scoring_api() POSTs each feature row to
        # SCORING_API_URL - previously nothing in the live pipeline ever
        # called scoring at all. uvicorn logs every request it serves, so a
        # "POST /score" line here is proof the HTTP call actually landed,
        # independent of whether scoring could score it (it can't yet in
        # this job - no model is registered, so it'll be a 503, same
        # cold-boot gap asserted above; that's expected and fine here, only
        # the *reachability* of the bridge is being checked).
        run: |
          set -e
          if ! docker compose -f infra/docker-compose.yml logs scoring | grep -q "POST /score"; then
            echo "::error::scoring never received a /score request from pipeline"
            exit 1
          fi

      - name: Register real fraud models in MLflow
        # Runs the actual, already-tested training scripts - not a rigged
        # stand-in - against the same committed data/features.xlsx and
        # transactions_raw.xlsx used for every prior real training run.
        # This closes SCRUM-36's last open gap: proving a real alert
        # reaches data/alerts.xlsx end to end, not just that the topology
        # is wired.
        #
        # Runs inside a throwaway container, not on the runner host,
        # for two reasons discovered by actually trying the host-side
        # approach first:
        #  1. mlflow's default-artifact-root (/mlruns, see docker-compose.yml)
        #     is a plain local path, not proxied over HTTP - a host-side
        #     client hits "PermissionError: /mlruns" trying to write
        #     artifacts directly to a path that only exists inside the
        #     mlflow container's own volume. --volumes-from shares that
        #     exact volume so /mlruns resolves the same way here.
        #  2. producer/pipeline run as root in their containers (no USER
        #     in their Dockerfiles) and continuously write into the same
        #     bind-mounted data/ dir via FileLock, creating *.lock files
        #     owned by root - a non-root host process can't open them.
        #     Plain `docker run` containers are root by default too, so
        #     this sidesteps that mismatch rather than chmod-ing around it.
        # --network container:<mlflow> shares mlflow's network namespace,
        # so MLFLOW_TRACKING_URI=http://localhost:5000 reaches it directly
        # without needing to know the compose-generated network name.
        #
        # Deliberately not models/requirements.txt verbatim: sdv/torch/seaborn
        # are only needed for CTGAN synthetic augmentation, off by default
        # (USE_SYNTHETIC_AUGMENTATION unset), and would add several minutes
        # of install time for nothing exercised here. Everything else below
        # (including the xgboost/scikit-learn versions) now matches
        # requirements.txt exactly - it used to diverge (scikit-learn pinned
        # to 1.5.2 here, 1.9.0 there) working around a real incompatibility:
        # xgboost==2.1.1 + scikit-learn==1.9.0 crashed
        # mlflow.xgboost.log_model() with "TypeError: `_estimator_type`
        # undefined" (sklearn 1.9 removed the plain _estimator_type
        # attribute xgboost 2.1.1's save_model() reads directly). Fixed at
        # the source by bumping xgboost to 3.2.0 (not Dependabot's proposed
        # 3.4.0 - that requires Python >=3.12, incompatible with this
        # project's python:3.11-slim base images) in both
        # models/requirements.txt and scoring/requirements.txt, verified
        # against the real training scripts (identical holdout F1=0.78, no
        # numeric drift) before changing either file.
        # Run from the repo root, not models/ - excel_reader.py's
        # FEATURES_XLSX/TRANSACTIONS_XLSX paths are relative to the process
        # cwd (data/features.xlsx), while the scripts' own
        # `from excel_reader import ...` resolves via sys.path[0], which
        # Python sets to the script's own directory regardless of cwd. See
        # models/README.md's documented invocation.
        run: |
          mlflow_cid=$(docker compose -f infra/docker-compose.yml ps -q mlflow)
          docker run --rm \
            --network "container:$mlflow_cid" \
            --volumes-from "$mlflow_cid" \
            -v "$PWD/data:/workspace/data" \
            -v "$PWD/models:/workspace/models" \
            -w /workspace \
            -e MLFLOW_TRACKING_URI=http://localhost:5000 \
            python:3.11-slim \
            bash -c "pip install --quiet mlflow==2.15.1 pandas==2.2.2 openpyxl==3.1.5 filelock==3.32.2 xgboost==3.2.0 scikit-learn==1.9.0 matplotlib==3.9.2 scipy==1.14.1 && python models/train_xgboost.py && python models/train_isolation_forest.py"

      - name: Install openpyxl for host-side alerts.xlsx polling
        run: pip install --quiet openpyxl==3.1.5

      - name: Capture data/alerts.xlsx row count before scoring goes live
        run: |
          baseline=$(python -c "import openpyxl; print(openpyxl.load_workbook('data/alerts.xlsx', read_only=True).active.max_row)")
          echo "ALERTS_BASELINE_ROWS=$baseline" >> "$GITHUB_ENV"
          echo "Baseline row count (including header): $baseline"

      - name: Assert scoring picks up the registered models
        # FraudScorer.score() retries try_load() on every /score call while
        # not ready (see scorer.py) - so /score itself is what triggers the
        # reload, not /health (health_status() just reports scorer.is_ready
        # live - see health.py - it doesn't call try_load()). Polling
        # /health alone would only pass once *some other* caller (pipeline)
        # happens to hit /score first; poll /score directly instead so this
        # doesn't depend on pipeline's own micro-batch timing.
        run: |
          set -e
          score_status=""
          for i in $(seq 1 12); do
            score_status=$(curl -s -o /tmp/score-live-response.json -w '%{http_code}' -X POST http://localhost:8000/score \
              -H "Content-Type: application/json" \
              -d '{"transaction_id":"ci-live-test","terminal_id":"TRM00001","card_bin":"539983","velocity_1h":1,"geo_jump_km":0,"bin_spend_rate":1000,"terminal_reversal_count":0,"amount_ngn":1000}')
            [ "$score_status" = "200" ] && break
            sleep 5
          done
          cat /tmp/score-live-response.json
          echo
          [ "$score_status" = "200" ] \
            || { echo "::error::expected 200 from /score once models are registered, got $score_status"; exit 1; }
          echo "Health after warm-up:"
          curl -sf http://localhost:8000/health

      - name: Run scoring/benchmark.py for real (SCRUM-33/44)
        # SCRUM-33/44's response-latency criterion had never actually been
        # measured - scoring/benchmark.py existed but had never been run
        # against a live service with real registered models. It can now:
        # models are trained and registered, scoring is warm (previous step
        # confirmed a real 200 response). Prints real p50/p95/max, not
        # simulated - whatever comes out is the honest number for the record,
        # pass or fail against the 250ms SLA test_api_latency.py encodes.
        run: |
          pip install --quiet requests
          python scoring/benchmark.py

      - name: Run integration tests for real (SCRUM-38)
        # tests/integration/test_api_latency.py and test_pipeline_e2e.py are
        # both pytest.mark.skipif-gated behind RUN_INTEGRATION_TESTS=1, and
        # .github/workflows/integration.yml never sets that var - so neither
        # test has ever actually executed, despite the "integration-tests"
        # CI check passing on every PR (it was silently skipping both,
        # every time). The full live stack - real registered models, scoring
        # warm, Kafka, ksqlDB - is available right here, so run them for
        # real instead of leaving them permanently skipped.
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          pip install --quiet pytest requests
          pytest tests/integration/ -v

      - name: Wait for a live fraud alert to reach data/alerts.xlsx
        # Producer runs continuously at 5 tx/sec with ~3.8% fraud injected
        # (producer/config.py, producer/transaction_generator.py) and
        # pipeline now calls /score against real trained models instead of
        # a cold 503. This is the one thing no earlier CI run ever proved:
        # a real alert completing the full producer -> pipeline -> scoring
        # -> kafka_publisher -> alert_stream -> alerts consumer ->
        # data/alerts.xlsx round trip. Reads happen from the host, not the
        # container, so a rare read racing the container's own write is
        # tolerated (treated as "no new row yet") rather than failing the job.
        run: |
          set -e
          found=0
          for i in $(seq 1 30); do
            current=$(python -c "import openpyxl; print(openpyxl.load_workbook('data/alerts.xlsx', read_only=True).active.max_row)" 2>/dev/null || echo 0)
            if [ "${current:-0}" -gt "$ALERTS_BASELINE_ROWS" ]; then
              echo "New alert(s) landed - row count $ALERTS_BASELINE_ROWS -> $current"
              python -c "import openpyxl; wb = openpyxl.load_workbook('data/alerts.xlsx', read_only=True); rows = list(wb.active.iter_rows(values_only=True)); [print(row) for row in rows[$ALERTS_BASELINE_ROWS:]]"
              found=1
              break
            fi
            sleep 5
          done
          [ "$found" = "1" ] \
            || { echo "::error::no new alert reached data/alerts.xlsx within the timeout - the producer/pipeline/scoring/ksqlDB/alerts round trip did not complete live"; exit 1; }

      - name: Dump scoring/pipeline/alerts logs after live scoring attempt
        if: always()
        run: |
          for svc in pipeline scoring alerts; do
            echo "::group::$svc logs (post-registration)"
            docker compose -f infra/docker-compose.yml logs --tail=150 "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
