version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # ksqlDB's command topic uses a transactional producer internally.
      # These both default to values >1, which a single-broker cluster can
      # never satisfy - every CREATE STREAM/TABLE timed out after 60s with
      # "Timeout expired while awaiting InitProducerId" as a result. Never
      # caught before because ksqlDB had never actually been exercised
      # against this broker until docker-boot-verify's SCRUM-34 step.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.6.0
    depends_on:
      - kafka
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: pos-fraud-ksqldb
    ports:
      - "8088:8088"
    volumes:
      - ../alerts:/alerts

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri /mlruns --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns

  producer:
    build:
      context: ..
      dockerfile: producer/Dockerfile
    depends_on:
      - kafka
    env_file:
      - ../.env
    environment:
      # .env's KAFKA_BOOTSTRAP_SERVERS=localhost:9092 is correct for a
      # process running on the host, not for a container - localhost inside
      # this container is its own loopback, not kafka's. Override to the
      # in-network service DNS name; takes precedence over env_file.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../data:/app/data

  pipeline:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    depends_on:
      - kafka
      - scoring
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # call_scoring_api() posts each computed feature row here - see
      # spark_consumer.py. Best-effort with its own timeout/retry handling,
      # so pipeline doesn't need scoring to be fully ready at start, just
      # reachable by the time messages start flowing.
      SCORING_API_URL: http://scoring:8000/score
    volumes:
      - ../data:/app/data

  scoring:
    build:
      context: ..
      dockerfile: scoring/Dockerfile
    depends_on:
      - kafka
      - mlflow
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      # mlflow's --default-artifact-root (/mlruns) is a plain local path,
      # not proxied over HTTP - mlflow.pyfunc.load_model() needs direct
      # filesystem access to read a registered model's artifact files, not
      # just HTTP access to the tracking server. Without this mount,
      # scoring could never actually load ANY registered model in this
      # topology, regardless of whether one existed - /score would 503
      # forever, not just during the documented cold-boot window. Same
      # named volume mlflow itself writes to, so both sides see the same
      # data.
      - mlruns:/mlruns

  alerts:
    build:
      context: ..
      dockerfile: alerts/Dockerfile
    depends_on:
      - kafka
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../data:/app/data

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    depends_on:
      - scoring
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data

volumes:
  mlruns:
