version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.6.0
    depends_on:
      - kafka
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: pos-fraud-ksqldb
    ports:
      - "8088:8088"
    volumes:
      - ../alerts:/alerts

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri /mlruns --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns

  producer:
    build:
      context: ..
      dockerfile: producer/Dockerfile
    depends_on:
      - kafka
    env_file:
      - ../.env
    environment:
      # .env's KAFKA_BOOTSTRAP_SERVERS=localhost:9092 is correct for a
      # process running on the host, not for a container - localhost inside
      # this container is its own loopback, not kafka's. Override to the
      # in-network service DNS name; takes precedence over env_file.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../data:/app/data

  pipeline:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    depends_on:
      - kafka
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ../data:/app/data

  scoring:
    build:
      context: ..
      dockerfile: scoring/Dockerfile
    depends_on:
      - kafka
      - mlflow
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    depends_on:
      - scoring
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data

volumes:
  mlruns:
